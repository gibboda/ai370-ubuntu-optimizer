name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
template: |
  ## What's Changed

  $CHANGES

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION

categories:
  - title: '### Added'
    labels:
      - 'enhancement'
      - 'feature'
    title-filter: '^feat(\(.+\))?!?:'
  - title: '### Fixed'
    labels:
      - 'bug'
      - 'fix'
    title-filter: '^fix(\(.+\))?!?:'
  - title: '### Changed'
    labels:
      - 'refactor'
      - 'chore'
      - 'improvement'
    title-filter: '^(refactor|chore|perf)(\(.+\))?!?:'
  - title: '### Documentation'
    labels:
      - 'documentation'
    title-filter: '^docs(\(.+\))?!?:'
  - title: '### CI/CD'
    labels:
      - 'ci'
    title-filter: '^(ci|test)(\(.+\))?!?:'

autolabeler:
  - label: 'enhancement'
    title:
      - '/^feat(\(.+\))?!?:/i'
  - label: 'bug'
    title:
      - '/^fix(\(.+\))?!?:/i'
  - label: 'refactor'
    title:
      - '/^refactor(\(.+\))?!?:/i'
  - label: 'chore'
    title:
      - '/^(chore|perf)(\(.+\))?!?:/i'
  - label: 'documentation'
    title:
      - '/^docs(\(.+\))?!?:/i'
  - label: 'ci'
    title:
      - '/^(ci|test)(\(.+\))?!?:/i'
  - label: 'bump:major'
    title:
      - '/^(feat|fix|refactor|chore|perf|docs|ci|test)(\(.+\))?!:/i'
  - label: 'bump:minor'
    title:
      - '/^feat(\(.+\))?:/i'

change-template: '- $TITLE (@$AUTHOR)'
change-title-escapes: '\<*_&'

version-resolver:
  major:
    labels:
      - 'bump:major'
  minor:
    labels:
      - 'bump:minor'
  patch:
    labels:
      - 'bump:patch'
  default: patch

exclude-labels:
  - 'skip-changelog'
