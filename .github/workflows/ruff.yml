name: Ruff

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ruff-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Ruff
        shell: bash
        run: pipx install 'ruff==0.17.3'

      - name: Ruff check
        shell: bash
        run: ruff check .

      - name: Ruff format check
        shell: bash
        run: ruff format --check .
