name: Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.2.3)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine release tag
        id: tag
        shell: bash
        env:
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_DISPATCH_TAG: ${{ github.event.inputs.tag }}
          GH_RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [[ "$GH_EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG="$GH_DISPATCH_TAG"
          else
            TAG="$GH_RELEASE_TAG"
          fi
          # Strip leading 'v' to get plain semver
          VERSION="${TAG#v}"
          echo "[INFO] Resolved tag: $TAG (version: $VERSION)"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Update VERSION file
        shell: bash
        env:
          NEW_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          echo "[INFO] Writing VERSION: $NEW_VERSION"
          echo "$NEW_VERSION" > VERSION

      - name: Update CHANGELOG.md
        uses: stefanzweifel/changelog-updater-action@v1
        with:
          latest-version: ${{ steps.tag.outputs.tag }}
          release-notes: ${{ github.event.release.body }}

      - name: Commit updated files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: release ${{ steps.tag.outputs.tag }} [skip ci]"
          file_pattern: VERSION CHANGELOG.md
          branch: main
          push_options: '--force-with-lease'

      - name: Create or update tag on release commit
        if: github.event_name == 'workflow_dispatch'
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          custom_tag: ${{ steps.tag.outputs.version }}
          tag_prefix: 'v'
