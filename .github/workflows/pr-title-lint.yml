name: PR Title Lint

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  lint-pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title follows Conventional Commits
        uses: amannn/action-semantic-pull-request@v5.5.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Allowed commit types (must match CONTRIBUTING.md)
          types: |
            feat
            fix
            chore
            refactor
            docs
            test
            ci
            perf
          # Optional scopes matching project script areas
          scopes: |
            audit
            baseline
            amd
            ai-stack
            rocm
            npu
            acceleration
            comfyui
            config
            workflows
            release
          requireScope: false
          subjectPattern: ^[A-Za-z].+$
          subjectPatternError: |
            The subject must start with a letter.
            Example: "feat(comfyui): Add SDXL workflow template"
          wip: true
          validateSingleCommit: false

  lint-pr-commits:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR commit subjects follow Conventional Commits
        uses: actions/github-script@v7
        with:
          script: |
            const allowedTypes = ['feat', 'fix', 'chore', 'refactor', 'docs', 'test', 'ci', 'perf'];
            const allowedScopes = ['audit', 'baseline', 'amd', 'ai-stack', 'rocm', 'npu', 'acceleration', 'comfyui', 'config', 'workflows', 'release'];
            const commitSubjectPattern = new RegExp(
              `^(?:${allowedTypes.join('|')})(?:\\((?:${allowedScopes.join('|')})\\))?!?: [A-Za-z].+$`
            );
            const workflowPath = '.github/workflows/pr-title-lint.yml';

            try {
              const { data } = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: workflowPath,
                ref: context.payload.pull_request.base.sha,
              });
              const baseWorkflow = Buffer.from(data.content, 'base64').toString('utf8');

              if (!baseWorkflow.includes('Validate PR commit subjects follow Conventional Commits')) {
                core.info('Skipping commit-subject enforcement until the base branch contains this workflow.');
                return;
              }
            } catch (error) {
              if (error.status === 404) {
                core.info('Skipping commit-subject enforcement because the base branch does not yet contain this workflow.');
                return;
              }

              throw error;
            }

            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });

            const invalidSubjects = commits
              .map(({ sha, commit }) => ({
                sha: sha.slice(0, 7),
                subject: commit.message.split('\n')[0],
              }))
              .filter(({ subject }) => !commitSubjectPattern.test(subject));

            if (invalidSubjects.length > 0) {
              core.setFailed(
                [
                  'The following commit subjects do not follow the required format `type(scope): Subject`:',
                  ...invalidSubjects.map(({ sha, subject }) => `- ${sha} ${subject}`),
                  'Allowed types: feat, fix, chore, refactor, docs, test, ci, perf.',
                  'Allowed scopes: audit, baseline, amd, ai-stack, rocm, npu, acceleration, comfyui, config, workflows, release.',
                  'The subject must start with a letter.',
                ].join('\n')
              );
            }
