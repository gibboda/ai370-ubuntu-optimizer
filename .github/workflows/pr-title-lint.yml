name: PR Title Lint

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions:
  pull-requests: read
  statuses: write

jobs:
  lint-pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title follows Conventional Commits
        uses: amannn/action-semantic-pull-request@v5.5.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Allowed commit types (must match CONTRIBUTING.md)
          types: |
            feat
            fix
            chore
            refactor
            docs
            test
            ci
            perf
          # Optional scopes matching project script areas
          scopes: |
            audit
            amd
            ai-stack
            rocm
            npu
            acceleration
            comfyui
            config
            workflows
            release
          requireScope: false
          subjectPattern: ^[A-Z].+$
          subjectPatternError: |
            The subject must start with an upper-case letter.
            Example: "feat(comfyui): Add SDXL workflow template"
          wip: true
          validateSingleCommit: false
