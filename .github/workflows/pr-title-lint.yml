name: PR Title Lint

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  lint-pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: Check if title lint exists on base branch
        id: title-lint-gate
        uses: actions/github-script@v7
        with:
          script: |
            const workflowPath = '.github/workflows/pr-title-lint.yml';
            if (context.payload.action === 'synchronize') {
              core.info('Skipping PR title enforcement on synchronize events; title checks run on opened, edited, and reopened events.');
              core.setOutput('enforce', 'false');
              return;
            }

            try {
              const { data } = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: workflowPath,
                ref: context.payload.pull_request.base.sha,
              });
              const baseWorkflow = Buffer.from(data.content, 'base64').toString('utf8');

              if (!baseWorkflow.includes('Validate PR title follows Conventional Commits')) {
                core.info('Skipping title enforcement until the base branch contains this workflow.');
                core.setOutput('enforce', 'false');
                return;
              }
            } catch (error) {
              if (error.status === 404) {
                core.info('Skipping title enforcement because the base branch does not yet contain this workflow.');
                core.setOutput('enforce', 'false');
                return;
              }

              throw error;
            }

            core.setOutput('enforce', 'true');

      - name: Check out repository
        if: steps.title-lint-gate.outputs.enforce == 'true'
        uses: actions/checkout@v4

      - name: Validate PR title follows Conventional Commits
        if: steps.title-lint-gate.outputs.enforce == 'true'
        run: bash scripts/validate-pr-title.sh "${{ github.event.pull_request.title }}"

  lint-pr-commits:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate PR commit subjects follow Conventional Commits
        uses: actions/github-script@v7
        with:
          script: |
            const { execFileSync } = require('node:child_process');
            const workflowPath = '.github/workflows/pr-title-lint.yml';

            try {
              const { data } = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: workflowPath,
                ref: context.payload.pull_request.base.sha,
              });
              const baseWorkflow = Buffer.from(data.content, 'base64').toString('utf8');

              if (!baseWorkflow.includes('Validate PR commit subjects follow Conventional Commits')) {
                core.info('Skipping commit-subject enforcement until the base branch contains this workflow.');
                return;
              }
            } catch (error) {
              if (error.status === 404) {
                core.info('Skipping commit-subject enforcement because the base branch does not yet contain this workflow.');
                return;
              }

              throw error;
            }

            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const legacyAllowedCommitShas = new Set([
              '9b00ebb',
              'ba39fe9',
              'b125679',
              '96e12a0',
              '8e1d5af',
              'd0f9a5a',
              'c101d13',
              'e197783',
              '91b51f3',
              '606ac61',
              '4ee93b6',
              'cfa9490',
              'f52ac5a',
              '8cf3dc1',
              '2639533',
              '1f8f31e',
            ]);

            if (commits.length <= 1) {
              core.info('Skipping commit-subject enforcement for single-commit PRs because the PR title lint already validates the squash-merge subject.');
              return;
            }

            const invalidSubjects = commits
              .map(({ sha, commit }) => ({
                fullSha: sha,
                sha: sha.slice(0, 7),
                subject: commit.message.split('\n')[0],
              }))
              .filter(({ fullSha, subject }) => {
                if (legacyAllowedCommitShas.has(fullSha.slice(0, 7))) {
                  core.info(`Skipping legacy commit subject enforcement for ${fullSha.slice(0, 7)}.`);
                  return false;
                }

                if (subject.startsWith('Merge ')) {
                  core.info(`Skipping merge commit subject enforcement for ${fullSha.slice(0, 7)}.`);
                  return false;
                }

                try {
                  execFileSync('bash', ['scripts/validate-commit-subject.sh', subject], {
                    encoding: 'utf8',
                    stdio: ['ignore', 'pipe', 'pipe'],
                  });
                  return false;
                } catch (error) {
                  core.info((error.stderr || error.stdout || String(error)).trim());
                  return true;
                }
              });

            if (invalidSubjects.length > 0) {
              core.setFailed(
                [
                  'The following commit subjects do not follow the required format `type(scope): Subject`:',
                  ...invalidSubjects.map(({ sha, subject }) => `- ${sha} ${subject}`),
                  'Run `bash scripts/validate-commit-subject.sh "type(scope): Subject"` locally for the full policy, including canonical milestone scopes like `s5-m6`.',
                ].join('\n')
              );
            }
