name: ShellCheck

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shellcheck-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check tracked shell scripts
        shell: bash
        run: |
          mapfile -t shell_files < <(git ls-files '*.sh')

          while IFS= read -r tracked; do
            [[ -f "$tracked" ]] || continue
            [[ "$tracked" == *.sh ]] && continue
            first_line=$(head -n 1 "$tracked" || true)
            if [[ "$first_line" =~ ^#!.*bash ]]; then
              shell_files+=("$tracked")
            fi
          done < <(git ls-files)

          if (( ${#shell_files[@]} == 0 )); then
            echo "No tracked shell scripts were found."
            exit 0
          fi

          shellcheck --severity=error "${shell_files[@]}"
