name: Portable Tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# Deterministic validation only. This workflow never calls an LLM and does
# not need repository secrets.
permissions:
  contents: read

concurrency:
  group: portable-tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  portable-tests:
    name: Portable tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Print runner disk and image metadata
        shell: bash
        run: |
          df -h
          df -h "$GITHUB_WORKSPACE"
          echo "$ImageOS $ImageVersion"

      - name: Snapshot CI host drift canary
        shell: bash
        run: bash .github/scripts/ci-host-drift-canary.sh snapshot "${RUNNER_TEMP}/ci-host-canary.txt"

      - name: Prepare unprivileged portable test user
        shell: bash
        run: bash .github/scripts/ci-prepare-portable-test-user.sh

      - name: Drop runner sudo before portable tests
        shell: bash
        run: bash .github/scripts/ci-drop-runner-sudo.sh

      - name: Assert sudo is unavailable during tests
        shell: bash
        env:
          AI370_CI_NO_HOST_MUTATION: "1"
        run: |
          bash .github/scripts/ci-as-test-user.sh bash -c '
            if sudo -n true 2>/dev/null; then
              echo "::error::passwordless sudo is still available to the portable test user"
              exit 1
            fi
            echo "sudo -n true failed as expected (portable tests run without passwordless sudo)"
          '

      - name: Run portable unit tests
        shell: bash
        env:
          AI370_CI_NO_HOST_MUTATION: "1"
        run: |
          bash .github/scripts/ci-as-test-user.sh python3 -m unittest \
            tests.test_system_profile \
            tests.test_s1_m1_probe \
            tests.test_s1_m2_normalize \
            tests.test_s1_m3_classify \
            tests.test_s1_m4_capabilities \
            tests.test_s1_m5_publish \
            tests.test_capability_ladder \
            tests.test_s2_visibility_schemas \
            tests.test_s2_m3_gpu_visibility \
            tests.test_s2_m4_npu_visibility \
            tests.test_s2_m7_platform_validation \
            tests.test_s2_m7_gate \
            tests.test_s2_m1_firmware \
            tests.test_s2_m2_kernel_driver \
            tests.test_s2_optimize_profile \
            tests.test_s2_m5_optimization_plan \
            tests.test_s2_m6_optimization_apply \
            tests.test_s2_m6_optimization_backup \
            tests.test_repository_instructions \
            tests.test_external_agent \
            tests.test_github_label_policy \
            tests.test_agent_role_contract \
            tests.test_agent_work_allocation \
            tests.test_agent_credential_capabilities \
            tests.test_agent_mcp_contract \
            tests.test_pr_governance_contract \
            tests.test_agent_cross_contract_consistency \
            tests.test_agent_contract_compatibility \
            tests.test_agent_distribution_contract

      - name: Run multi-agent architecture conformance
        shell: bash
        env:
          AI370_CI_NO_HOST_MUTATION: "1"
        run: |
          bash .github/scripts/ci-as-test-user.sh python3 -m unittest tests.test_agent_architecture_conformance
          bash .github/scripts/ci-as-test-user.sh python3 -m unittest tests.test_agent_architecture_coverage
          bash .github/scripts/ci-as-test-user.sh python3 -m unittest discover -s tests -p 'test_agent_architecture_mutations*.py'

      - name: Run portable smoke tests
        shell: bash
        env:
          AI370_CI_NO_HOST_MUTATION: "1"
        run: |
          bash .github/scripts/ci-as-test-user.sh bash tests/smoke_tier1.sh
          bash .github/scripts/ci-as-test-user.sh bash tests/smoke_stage2_platform.sh
          bash .github/scripts/ci-as-test-user.sh bash tests/smoke_tier2.sh

      - name: Prepare reports for artifact upload
        if: always()
        shell: bash
        run: |
          sudo bash -c '
            owner="$1"
            if [[ -d reports && ! -L reports && -d reports/latest && ! -L reports/latest ]]; then
              chown --no-dereference "$owner" reports
              chown -R --no-dereference "$owner" reports/latest
            fi
          ' _ "$(id -u):$(id -g)"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: portable-test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/latest/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify CI host drift canary
        if: always()
        shell: bash
        run: bash .github/scripts/ci-host-drift-canary.sh verify "${RUNNER_TEMP}/ci-host-canary.txt"
