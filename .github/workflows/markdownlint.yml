name: markdownlint

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: markdownlint-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Collect Markdown files to lint
        id: markdown-files
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t files < <(
            if [[ "${{ github.event_name }}" == "pull_request" ]]; then
              git diff --name-only --diff-filter=ACMRT \
                "${{ github.event.pull_request.base.sha }}" HEAD \
                -- '*.md' '*.markdown'
            elif [[ "${{ github.event_name }}" == "push" ]]; then
              before="${{ github.event.before }}"
              if [[ "$before" == "0000000000000000000000000000000000000000" ]]; then
                git ls-files '*.md' '*.markdown'
              else
                git diff --name-only --diff-filter=ACMRT \
                  "$before" "${{ github.sha }}" \
                  -- '*.md' '*.markdown'
              fi
            else
              git ls-files '*.md' '*.markdown'
            fi | sed '/^CHANGELOG\.md$/d' | sort -u
          )

          if (( ${#files[@]} == 0 )); then
            echo "No Markdown files changed; skipping markdownlint."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "files<<EOF"
            printf '%s\n' "${files[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          printf 'Linting %s Markdown file(s):\n' "${#files[@]}"
          printf '  %s\n' "${files[@]}"

      - name: Run markdownlint-cli2
        if: steps.markdown-files.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files <<< "${{ steps.markdown-files.outputs.files }}"
          npx markdownlint-cli2 --no-globs "${files[@]}"
