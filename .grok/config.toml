# Project-scoped Grok Build GitHub MCP.
# This file ships with the repository and must contain no secrets.
# Grok expands ${VAR} in url, command, args, env, and headers.
# Vendor model credentials are not GitHub authorization.
#
# Project .grok/config.toml may only contribute [mcp_servers], [plugins],
# and [permission]. Put [compat.cursor] in ~/.grok/config.toml so Grok
# does not import Cursor's CURSOR_GH_PAT from .cursor/mcp.json.
# See .github/github-mcp.md.

[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp/"
headers = { Authorization = "Bearer ${GROK_GH_PAT}", "X-MCP-Toolsets" = "default,projects", "X-MCP-Readonly" = "true" }
